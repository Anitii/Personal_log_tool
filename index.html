<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日常甘特</title>
  <meta name="description" content="把任務拆細的日常甘特圖，手機、平板、電腦都能用。">
  <meta name="theme-color" content="#F3EADF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1813" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日常甘特">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/core.js">
  <link rel="modulepreload" href="js/markdown.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/sync.js">
  <link rel="modulepreload" href="js/sheet.js">
  <link rel="modulepreload" href="js/views.js">
  <link rel="modulepreload" href="js/gantt.js">
  <link rel="modulepreload" href="js/planner.js">
  <link rel="modulepreload" href="js/calendar.js">
  <link rel="modulepreload" href="js/diary.js">
  <link rel="modulepreload" href="js/pinch.js">
  <link rel="modulepreload" href="js/week.js">
  <link rel="modulepreload" href="js/gcal.js">
  <link rel="modulepreload" href="js/project.js">
  <script>
    // Set the theme before first paint so dark mode never flashes white.
    try {
      var t = JSON.parse(localStorage.getItem('dg.prefs.v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}

    // Boot guard: if the app has not started a few seconds in (a module failed to load or
    // threw), show what went wrong and offer to drop the offline copy and load it fresh.
    // Saved data lives in localStorage and is not touched.
    (function () {
      var errors = [];
      addEventListener('error', function (e) {
        var src = e.target && e.target.src;
        errors.push(e.message || (src ? '無法載入 ' + src : '載入失敗'));
      }, true);
      addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason)); });
      setTimeout(function () {
        if (window.dgBooted) return;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:16px/1.5 -apple-system,system-ui,sans-serif;background:#F6F1EA;color:#3B2F27';
        box.innerHTML = '<b style="font-size:19px">頁面沒有載入成功</b>'
          + '<span>通常是舊版的離線檔案還留在瀏覽器裡。按下面的按鈕會清掉離線檔案再重新載入，你的資料不會被刪除。</span>'
          + '<button type="button" style="font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:12px;background:#8B6A4F;color:#fff">清除離線檔案並重新載入</button>'
          + '<small style="max-width:640px;color:#8a7a6c;word-break:break-all"></small>';
        box.querySelector('small').textContent = errors.slice(0, 3).join(' ／ ');
        box.querySelector('button').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('daily-gantt-') === 0; }).map(function (k) { return caches.delete(k); })); }));
          // The browser's own HTTP cache can hold old copies too: fetch every script and the
          // stylesheet past it, which replaces what it stored.
          var urls = ['js/main.js', 'css/app.css'];
          document.querySelectorAll('link[rel="modulepreload"]').forEach(function (l) { urls.push(l.getAttribute('href')); });
          // Only after the offline copy is gone, or the old worker would answer from it.
          var refetch = function () { return Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); })); };
          this.disabled = true;
          this.textContent = '重新載入中…';
          Promise.all(jobs).catch(function () {}).then(refetch).then(function () { location.reload(); });
        };
        document.body.appendChild(box);
      }, 5000);
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main"></main>
    <nav id="tabbar" class="tabbar" aria-label="主選單"></nav>
  </div>
  <dialog id="sheet" class="sheet" aria-label="任務內容"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-input" type="file" hidden>
  <noscript>這個工具需要啟用 JavaScript。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
